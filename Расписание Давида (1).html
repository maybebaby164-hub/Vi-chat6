<style>
:root{--bg:#efeaf5;--ink:#1f1a2b;--mute:#7d7592;--acc:#7a2340;--hi:#f3dc8c;--line:#d9d0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121f;--ink:#f1ecf8;--mute:#9c93b2;--acc:#f19ab4;--line:#322a44}}
:root[data-theme="dark"]{--bg:#17121f;--ink:#f1ecf8;--mute:#9c93b2;--acc:#f19ab4;--line:#322a44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 18px 4px;max-width:1100px;margin:0 auto}
h1{margin:0;font:600 30px/1.1 Unbounded,"Golos Text",system-ui,sans-serif}
header p{margin:8px 0 0;color:var(--mute);font-size:14px}
#strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;padding:12px 18px;overflow-x:auto;background:var(--bg)}
.chip{flex:0 0 auto;display:grid;justify-items:center;gap:4px;color:var(--mute);font-size:12px;text-decoration:none}
.chip img{width:48px;height:48px;border-radius:50%;object-fit:cover;outline:2px solid transparent;outline-offset:2px}
.chip.on{color:var(--acc);font-weight:600}.chip.on img{outline-color:var(--acc)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 20px;padding:10px 18px 40px;max-width:1100px;margin:0 auto}
section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 96px)}
.ph{position:relative;aspect-ratio:4/5;border-radius:26px 26px 4px 4px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(20,10,30,.7))}
h2{position:absolute;left:18px;bottom:14px;z-index:1;margin:0;color:#fff;font:600 24px/1.1 Unbounded,"Golos Text",system-ui,sans-serif}
.ph b{position:absolute;top:14px;right:14px;z-index:1;background:var(--hi);color:#2a2112;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}
.row{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row span{color:var(--acc);font-size:14px;font-weight:600;padding-top:1px}
.t{min-height:24px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere}
.t:empty::before{content:attr(data-ph);color:var(--mute);opacity:.7}
.t:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
body{-webkit-tap-highlight-color:transparent}
</style>

const put=()=>{try{localStorage.setItem('week1',JSON.stringify(st))}catch(e){}};

D.forEach((d,i)=>{
 const im=`<img src="${P[i].s}" style="object-position:${P[i].p}" alt="">`;
 strip.insertAdjacentHTML('beforeend',`<a class="chip${i==td?' on':''}" href="#d${i}">${im}<span>${S[i]}</span></a>`);
 list.insertAdjacentHTML('beforeend',`<section id="d${i}"><div class="ph">${im}<h2>${d}</h2>${i==td?'<b>сегодня</b>':''}</div>${B.map((b,j)=>`<div class="row"><span>${b}</span><div class="t" contenteditable="true" data-ph="Добавить дела" data-k="${i}-${j}"></div></div>`).join('')}</section>`);

<script>
(function(){try{
var H=location.hash,tg=/tgWebApp/.test(H)||window.TelegramWebviewProxy;
if(!tg)return;
var fr=window.parent!==window;
function send(t,d){d=d||{};try{
 if(window.TelegramWebviewProxy)TelegramWebviewProxy.postEvent(t,JSON.stringify(d));
 else if(fr)parent.postMessage(JSON.stringify({eventType:t,eventData:d}),'*');
}catch(e){}}
function bars(){var m=getComputedStyle(document.body).backgroundColor.match(/\d+/g);
 if(m){var x='#'+m.slice(0,3).map(function(v){return(+v).toString(16).padStart(2,'0')}).join('');
  send('web_app_set_header_color',{color:x});send('web_app_set_background_color',{color:x});send('web_app_set_bottom_bar_color',{color:x})}}
function theme(p){
 if(p&&p.bg_color){var n=parseInt(p.bg_color.slice(1),16),l=((n>>16&255)*299+(n>>8&255)*587+(n&255)*114)/1000;
  document.documentElement.dataset.theme=l<128?'dark':'light'}
 bars()}
window.Telegram=window.Telegram||{};
if(!Telegram.WebView)Telegram.WebView={receiveEvent:function(t,d){if(t=='theme_changed')theme(d&&d.theme_params)}};
addEventListener('message',function(e){try{var m=JSON.parse(e.data);if(m.eventType=='theme_changed')theme(m.eventData.theme_params)}catch(x){}});
if(fr)send('iframe_ready',{reload_supported:true});
send('web_app_ready');send('web_app_expand');send('web_app_setup_swipe_behavior',{allow_vertical_swipe:false});
var tp;try{tp=JSON.parse(new URLSearchParams(H.slice(1)).get('tgWebAppThemeParams'))}catch(e){}
theme(tp);
}catch(e){}})();
</script>
